name: Unpack project sources
on:
  push:
    paths:
      - '.github/workflows/unpack.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project sources
        run: |
          python3 - <<'PY'
          import base64, io, lzma, pathlib, tarfile
          parts = [pathlib.Path(f".upload/part{i}.txt").read_text() for i in (1, 2, 3)]
          archive = lzma.decompress(base64.urlsafe_b64decode("".join(parts)))
          with tarfile.open(fileobj=io.BytesIO(archive)) as tar:
              for member in tar.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or not member.isfile():
                      raise ValueError("Invalid archive member")
                  target = pathlib.Path(member.name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(tar.extractfile(member).read())
          for i in (1, 2, 3):
              pathlib.Path(f".upload/part{i}.txt").unlink()
          pathlib.Path(".upload").rmdir()
          PY
      - name: Commit sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upload JavaFX contact management sources"
          git push
